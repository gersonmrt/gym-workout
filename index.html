<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treino — Gerson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root{
    --bg:#121110;
    --surface:#1B1815;
    --surface-2:#231F1A;
    --border:#332C24;
    --border-strong:#453B2F;
    --rust:#D2571C;
    --rust-dim:#7A3413;
    --chalk:#B7CC4E;
    --chalk-dim:#5C6926;
    --text:#F2EDE2;
    --text-2:#A79C8B;
    --text-3:#6E6355;
    --danger:#C0432E;
    --shadow:0 6px 18px rgba(0,0,0,0.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    min-height:100vh;
    padding-bottom:104px;
  }
  .display{font-family:'Oswald',sans-serif; letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    padding:20px 16px 14px;
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-size:11px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--text-3); font-weight:500; margin-bottom:2px;
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between;}
  h1{
    font-size:22px; font-weight:600; margin:0;
    text-transform:uppercase;
    font-family:'Oswald',sans-serif;
  }

  .day-progress-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:12px; font-size:12px;
  }
  .day-sub-label{color:var(--text-2); font-weight:500;}
  .day-fraction{color:var(--chalk); font-size:12px;}
  .day-progress-bar{
    margin-top:6px; height:5px; border-radius:3px;
    background:var(--surface-2); overflow:hidden;
    border:1px solid var(--border);
  }
  .day-progress-fill{
    height:100%; width:0%; background:linear-gradient(90deg,var(--chalk-dim),var(--chalk));
    border-radius:3px; transition:width .3s ease;
  }

  .day-tabs{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(64px,1fr)); gap:8px;
    padding:14px 16px 4px;
  }
  .day-tab{
    aspect-ratio:1/0.66;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:600;
    color:var(--text-2);
    position:relative;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
    padding-bottom:12px;
  }
  .day-tab:active{transform:scale(0.96);}
  .day-tab .letter{font-size:22px; line-height:1;}
  .day-tab .sub{font-size:9px; letter-spacing:0.06em; text-transform:uppercase; margin-top:3px; color:var(--text-3);}
  .day-tab.active{
    background:var(--rust-dim);
    border-color:var(--rust);
    color:#FBE7DA;
  }
  .day-tab.active .sub{color:#E9B79A;}
  .day-tab .tab-progress{
    position:absolute; left:8px; right:8px; bottom:7px;
    height:3px; border-radius:2px; overflow:hidden;
    background:rgba(255,255,255,0.08);
  }
  .day-tab.active .tab-progress{background:rgba(0,0,0,0.22);}
  .day-tab .tab-progress-fill{
    height:100%; background:var(--chalk); border-radius:2px;
    transition:width .3s ease;
  }
  .day-tab .tab-check{
    position:absolute; top:6px; right:7px;
    font-size:10px; font-weight:700; color:var(--chalk);
  }

  main{padding:18px 16px 10px;}

  .section-label{
    display:flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-3); font-weight:600;
    margin:22px 0 10px;
  }
  .section-label:first-child{margin-top:0;}
  .section-label .line{flex:1; height:1px; background:var(--border);}

  .warmup{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:3px solid var(--chalk-dim);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:4px;
    box-shadow:var(--shadow);
    animation:cardIn .28s ease both;
  }
  .warmup-head{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--chalk); font-weight:600; margin-bottom:8px;
    background:rgba(183,204,78,0.1); padding:3px 9px; border-radius:20px;
  }
  .warmup-item-wrap{border-top:1px solid var(--border);}
  .warmup-item-wrap:first-child{border-top:none;}
  .warmup-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; font-size:14px;
  }
  .warmup-item span.clickable{color:var(--text); cursor:pointer;}
  .warmup-item .reps{color:var(--text-2); font-size:12px;}
  .warmup-item .vid-icon{color:var(--rust); margin-left:6px; flex-shrink:0; font-size:11px;}
  .warmup-item-wrap .vid-embed.open{margin-bottom:8px;}

  .ex-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 14px 12px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    animation:cardIn .28s ease both;
  }
  @keyframes cardIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .ex-top{display:flex; gap:10px; align-items:flex-start;}
  .ex-num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--rust);
    background:rgba(210,87,28,0.12);
    border-radius:5px; padding:3px 6px;
    flex-shrink:0; margin-top:2px;
  }
  .ex-name-wrap{flex:1; min-width:0;}
  .ex-name{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:16px;
    text-transform:uppercase; line-height:1.2;
    color:var(--text);
    display:inline; cursor:pointer;
  }
  .ex-name .vid-icon{color:var(--rust); font-size:12px; margin-left:6px;}

  .vid-embed{
    display:none; margin-top:10px;
    border-radius:8px; overflow:hidden; background:#000;
  }
  .vid-embed.open{
    display:block; position:relative; height:0; padding-bottom:56.25%;
  }
  .vid-embed.open iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:0;
  }
  .vid-fallback{
    padding:10px 12px; font-size:12px; color:var(--text-2); background:var(--surface-2);
  }
  .vid-fallback a{color:var(--rust);}

  .ex-stats{
    display:flex; gap:16px;
    margin-top:9px;
  }
  .stat{display:flex; flex-direction:column; gap:2px;}
  .stat-label{font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-3); font-weight:600;}
  .stat-value{font-size:13px; color:var(--text);}

  .ex-note{
    margin-top:9px; padding:8px 10px;
    background:rgba(183,204,78,0.08);
    border-left:2px solid var(--chalk-dim);
    border-radius:0 6px 6px 0;
    font-size:12px; color:var(--chalk);
  }
  .superset-tag{
    display:inline-block; font-size:10px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--rust);
    border:1px solid var(--rust-dim); border-radius:5px;
    padding:1px 6px; margin-bottom:8px;
  }
  .sup-item{margin-bottom:9px; padding-bottom:9px; border-bottom:1px solid var(--border);}
  .sup-item:last-child{margin-bottom:0; padding-bottom:0; border-bottom:none;}
  .sup-item .reps-pill{
    display:inline-block; margin-top:4px;
    font-size:12px; color:var(--text-2);
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:2px 9px;
  }

  .rounds{
    display:flex; gap:7px; margin-top:12px; flex-wrap:wrap;
  }
  .rnd{
    width:36px; height:36px; border-radius:50%;
    border:1.5px solid var(--border-strong);
    background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-2);
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .rnd.done{
    background:var(--chalk-dim); border-color:var(--chalk);
    color:#EFF4CF; font-size:14px; font-weight:700;
  }
  .rnd:active{transform:scale(0.9);}
  .rnd.pop{animation:rndPop .22s ease;}
  @keyframes rndPop{
    0%{transform:scale(1);}
    45%{transform:scale(1.28);}
    100%{transform:scale(1);}
  }

  .reset-btn{
    display:block; margin:20px auto 6px;
    background:none; border:1px solid var(--border-strong);
    color:var(--text-2); font-size:12px; font-family:'Inter',sans-serif;
    padding:8px 16px; border-radius:20px;
  }

  .timer-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--rust); color:#2A1206;
    padding:12px 16px 14px;
    transform:translateY(100%);
    transition:transform .25s ease;
    box-shadow:0 -8px 24px rgba(0,0,0,0.35);
  }
  .timer-bar.show{transform:translateY(0);}
  .timer-progress-track{
    height:3px; border-radius:2px; background:rgba(0,0,0,0.22);
    overflow:hidden; margin-bottom:10px;
  }
  .timer-progress-fill{
    height:100%; width:100%; background:#2A1206; border-radius:2px;
    transition:width 1s linear;
  }
  .timer-top{display:flex; align-items:center; justify-content:space-between;}
  .timer-top .lbl{font-size:12px; text-transform:uppercase; letter-spacing:0.08em; font-weight:600;}
  .timer-top .num{font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; line-height:1;}
  .timer-controls{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .tbtn{
    background:rgba(0,0,0,0.16); border:none; color:#2A1206;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px;
    padding:9px 10px; border-radius:8px; flex:1;
  }
  .tbtn:active{background:rgba(0,0,0,0.28);}
  .tbtn.pause-btn{flex:0 0 auto; width:42px; font-size:14px;}
  .tbtn.skip{background:rgba(0,0,0,0.28); flex:1.3;}

  .timer-flash{
    position:fixed; inset:0; z-index:60;
    background:var(--chalk);
    opacity:0; pointer-events:none;
  }
  .timer-flash.active{
    animation:flashPulse 0.65s ease-in-out 3;
  }
  @keyframes flashPulse{
    0%{opacity:0;}
    50%{opacity:0.85;}
    100%{opacity:0;}
  }

  .import-btn{
    background:none; border:1px solid var(--border-strong); color:var(--text-2);
    font-size:11px; padding:6px 10px; border-radius:16px; font-family:'Inter',sans-serif;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:flex-start; justify-content:center;
    z-index:50; padding:16px; overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:18px; width:100%; max-width:400px; margin-top:30px;
    box-shadow:var(--shadow);
  }
  .modal-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; text-transform:uppercase; margin-bottom:6px;}
  .modal-hint{font-size:12px; color:var(--text-2); margin-bottom:12px; line-height:1.5;}
  .upload-zone{
    border:1.5px dashed var(--border-strong); border-radius:10px;
    padding:22px 14px; text-align:center; cursor:pointer;
    background:var(--surface-2);
  }
  .upload-zone:active{background:var(--surface);}
  .upload-zone .up-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; text-transform:uppercase; color:var(--text);}
  .upload-zone .up-sub{font-size:11px; color:var(--text-3); margin-top:4px;}
  .upload-status{font-size:12px; color:var(--chalk); margin-top:10px; text-align:center;}
  .manual-toggle{
    display:block; margin:14px auto 0; background:none; border:none;
    color:var(--text-3); font-size:11px; text-decoration:underline;
  }
  #manualPasteWrap{display:none; margin-top:10px;}
  #importTextarea{
    width:100%; min-height:160px; background:var(--surface-2); color:var(--text);
    border:1px solid var(--border-strong); border-radius:8px; padding:10px;
    font-family:'JetBrains Mono',monospace; font-size:12px; resize:vertical;
  }
  .modal-actions{display:flex; gap:8px; margin-top:12px;}
  .modal-actions button{
    flex:1; padding:10px; border-radius:8px; font-size:13px; font-family:'Inter',sans-serif; font-weight:600;
    border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text);
  }
  .btn-confirm-import{
    width:100%; margin-top:10px; padding:12px; border-radius:8px; font-size:13px; font-weight:600;
    font-family:'Inter',sans-serif; background:var(--rust); border:1px solid var(--rust); color:#2A1206;
  }
  .import-summary{margin-top:10px; font-size:13px;}
  .import-day{padding:4px 0; border-top:1px solid var(--border);}
  .import-day:first-child{border-top:none;}
  .import-warnings{margin-top:10px; font-size:11px; color:var(--chalk); line-height:1.5;}
  .import-error{margin-top:10px; font-size:12px; color:var(--danger);}
  .modal-restore{
    display:block; margin:14px auto 0; background:none; border:none;
    color:var(--text-3); font-size:11px; text-decoration:underline;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Gerson · academia</div>
  <div class="title-row">
    <h1>Treino</h1>
    <button class="import-btn" onclick="openImportModal()">Importar</button>
  </div>
  <div class="day-progress-row">
    <span class="day-sub-label" id="daySubLabel"></span>
    <span class="day-fraction mono" id="dayFraction"></span>
  </div>
  <div class="day-progress-bar"><div class="day-progress-fill" id="dayProgressFill"></div></div>
</header>

<div class="day-tabs" id="dayTabs"></div>

<main id="main"></main>

<div class="timer-bar" id="timerBar">
  <div class="timer-progress-track"><div class="timer-progress-fill" id="timerProgressFill"></div></div>
  <div class="timer-top">
    <div class="lbl">Descanso</div>
    <div class="num mono" id="timerNum">00:00</div>
  </div>
  <div class="timer-controls">
    <button class="tbtn" id="minus15Btn">−15</button>
    <button class="tbtn pause-btn" id="pauseBtn">⏸</button>
    <button class="tbtn" id="plus15Btn">+15</button>
    <button class="tbtn skip" id="skipBtn">Pular</button>
  </div>
</div>

<div class="timer-flash" id="timerFlash"></div>

<div class="modal-overlay" id="importOverlay">
  <div class="modal-panel">
    <div class="modal-title">Importar treino novo</div>
    <div class="modal-hint">Envie o arquivo .docx do treino novo. Isso substitui o treino atual e zera o progresso.</div>

    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('wordFileInput').click()">
      <div class="up-title"><i>📄</i> Escolher arquivo Word</div>
      <div class="up-sub">.docx — toque para selecionar</div>
    </div>
    <input type="file" id="wordFileInput" accept=".docx" style="display:none" onchange="handleWordFile(this.files[0])">
    <div class="upload-status" id="uploadStatus"></div>

    <button class="manual-toggle" id="manualToggleBtn" onclick="toggleManualPaste()">Colar texto manualmente em vez disso</button>
    <div id="manualPasteWrap">
      <textarea id="importTextarea" placeholder="AQUECIMENTO: 3 rounds: ..."></textarea>
      <div class="modal-actions">
        <button onclick="closeImportModal()">Cancelar</button>
        <button onclick="analyzeImport()">Analisar</button>
      </div>
    </div>

    <div id="importResult"></div>
    <button class="btn-confirm-import" id="confirmImportBtn" style="display:none;" onclick="confirmImport()">Confirmar e substituir treino</button>
    <button class="modal-restore" onclick="restoreDefault()">Restaurar treino padrão original</button>
    <button class="modal-restore" onclick="closeImportModal()">Fechar</button>
  </div>
</div>


<script>
const DEFAULT_DATA = [
  {
    id:'A', label:'Treino A', sub:'Pernas',
    warmup:{
      rounds:3,
      items:[
        {name:'Passada reversa cruzada', reps:'10/10', url:'https://www.youtube.com/shorts/bRdYP5SOea0'},
        {name:'Prancha + abdução de quadril', reps:'40”', url:'https://www.youtube.com/shorts/b4gopAco59Q'}
      ]
    },
    exercises:[
      {name:'Levantamento terra sumo deadstop', url:'https://www.youtube.com/watch?v=V29hLkh3JBA', rounds:4, rest:'2’', reps:'5 reps', note:'Descer em 5”'},
      {name:'Passada reversa com déficit Smith', url:'https://www.youtube.com/shorts/CnQ4y2nm5co', rounds:4, rest:'90”', reps:'8 reps cada perna'},
      {name:'Cadeira extensora unilateral', url:'https://www.youtube.com/shorts/FyrO55GJtz4', rounds:4, rest:'1’', reps:'12 reps cada perna', note:'Pausar 10” na última rep'}

      rounds:3,

        {name:'Rotação externa com db', reps:'10/10', url:null}
      ]
    },

      {superset:true, rounds:4, rest:'90”', items:[
        {name:'Remada curvada com db', reps:'10 reps', url:'https://www.youtube.com/watch?v=6gvmcqr226U'},

      ]},
      {superset:true, rounds:4, rest:'1’', items:[

      ]
    },
    exercises:[
      {name:'Elevação pélvica', url:'https://www.youtube.com/watch?v=5S8SApGU_Lk', rounds:4, rest:'90”', reps:'15 reps'},
      {name:'Agachamento smith calcanhar elevado', url:'https://www.youtube.com/watch?v=usnktuCEOyE', rounds:4, rest:'1’', reps:'8 reps', note:'Descer em 5” e subir em 5”'},
      {name:'Mesa flexora unilateral', url:'https://www.youtube.com/watch?v=Ymb82A_eMO4', rounds:4, rest:'1’', reps:'12 reps cada perna'}
    ]
  },
  {
    id:'D', label:'Treino D', sub:'Peito · costas',
    warmup:{
      tabata:true,
      items:[
        {name:'Barra escapular', url:'https://www.youtube.com/watch?v=pE8PJsWEV7k'},
        {name:'Apoio escapular', url:'https://www.youtube.com/watch?v=huGj4aBk9C4'}
      ]
    },
    exercises:[
      {name:'Crucifixo inclinado com db', url:'https://www.youtube.com/watch?v=JSDpq14vCZ8', rounds:3, rest:'1’', reps:'12 reps', note:'Abrir em 5”'},
      {name:'Supino com db', url:'https://www.youtube.com/watch?v=ZaDlbm8E8Tg', rounds:3, rest:'90”', reps:'6-9 reps pesadas'},
      {name:'Barra supinada', url:'https://www.youtube.com/shorts/jIvbJzs1V4I', rounds:3, rest:'90”', reps:'Max reps em 30”'},
      {name:'Remada aberta máquina', url:'https://www.youtube.com/shorts/EVZgKZIW_cY', rounds:3, rest:'1’', reps:'20 reps'},
      {superset:true, rounds:6, rest:'30”', items:[
        {name:'Facepull polia', reps:'10 reps', url:'https://www.youtube.com/watch?v=-MODnZdnmAQ'},
        {name:'Tríceps corda', reps:'Max reps', url:'https://www.youtube.com/watch?v=-xa-6cQaZKY'}
      ]}
    ]
  },
  {
    id:'E', label:'Abdominal', sub:'Abdominal',
    warmup:{rounds:0, items:[]},

function repairMarkdownLinks(raw){
  let t = raw.replace(/\[([^\]]*)\]/g, (m, label)=>{
    let fixed = label.replace(/[ \t]*\n[ \t]*/g, '/');
    fixed = fixed.replace(/\s+/g,' ').trim();
    return '['+fixed+']';
  });
  t = t.replace(/\]\s*\(([^)]*)\)/g, (m, url)=>{
    let fixed = url.replace(/[ \t]*\n[ \t]*/g, '/');
    fixed = fixed.replace(/\s+/g,'');
    fixed = fixed.replace(/^(https?:)\/+/i, '$1//');
    return '](' + fixed + ')';
  });
  return t;
}

function parseWorkoutText(raw){
  const warnings = [];
  const text = repairMarkdownLinks(raw.replace(/\r\n/g,'\n'));
  const idxs = [];
  const findRe = /aquecimento/gi;
  let fm;
  while((fm = findRe.exec(text))){ idxs.push(fm.index); }
  if(idxs.length===0){ throw new Error('Não encontrei "AQUECIMENTO" no texto. Verifique o formato.'); }
  const chunks = idxs.map((start,i)=> text.slice(start, i+1<idxs.length?idxs[i+1]:text.length));

  const letters = 'ABCDEFGHIJKL';
  const days = [];
  let dayCounter = 0;
  const warmupHeaderRe = /^aquecimento\s*:?\s*(.*)$/i;
  const roundsLineRe = /^[A-Za-z]?\s*-?\s*(\d+)\s*rounds?\s*:?\s*(.*)$/i;
  const bisetRe = /^(bi-?set|set\s*combinado)$/i;
  const absRe = /^abdominal:?$/i;

  const mapEx = e => e.superset
    ? {superset:true, rounds:e.rounds, rest:e.rest, items:e.items}
    : {name:e.name, url:e.url, rounds:e.rounds, rest:e.rest, reps:e.reps||'', note:e.note};

  function finalizeDay(exercisesArr, warmupObj, subLabel){
    if(!exercisesArr.length) return;
    days.push({
      id: letters[dayCounter] || String(dayCounter+1),
      label: subLabel === 'Abdominal' ? 'Abdominal' : 'Treino '+(letters[dayCounter]||(dayCounter+1)),
      sub: subLabel,
      warmup: warmupObj,
      exercises: exercisesArr.map(mapEx)
    });
    dayCounter++;
  }

  chunks.forEach((chunk, ci)=>{
    const lines = chunk.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    if(lines.length===0) return;

    let startIdx = 1;
    const firstRoundsIdx = lines.findIndex((l,i)=> i>0 && roundsLineRe.test(l));
    const warmupEndIdx = firstRoundsIdx === -1 ? lines.length : firstRoundsIdx;
    const warmupJoined = lines.slice(0, warmupEndIdx).join(' ');
    startIdx = warmupEndIdx;

    const wm = warmupJoined.match(warmupHeaderRe);
    const warmup = {rounds:3, items:[]};
    if(wm){
      const rest = wm[1] || '';
      if(/tabata/i.test(rest)) warmup.tabata = true;
      const rn = rest.match(/(\d+)\s*rounds?/i);
      if(rn) warmup.rounds = parseInt(rn[1],10);
      rest.split(/\/\s+/).forEach(p=>{
        const lm = [...p.matchAll(/\[([^\]]+)\]\(([^)]+)\)/g)];
        if(lm.length){
          lm.forEach(mm=> warmup.items.push({name: mm[1].trim(), url: mm[2].trim()}));
        } else {
          const t = p.replace(/^\s*\d+\s*rounds?\s*:?\s*/i,'').replace(/tabata/i,'').trim();
          if(t) warmup.items.push({name:t, url:null});
        }
      });
    } else {
      warnings.push('Dia '+(ci+1)+': não consegui interpretar o cabeçalho de aquecimento.');
    }

    let exercises = [];
    let target = exercises;
    let current = null;
    let inAbs = false;

    function pushCurrent(){
      if(current){
        if(current.superset){ if(current.items.length) target.push(current); }
        else if(current.name) target.push(current);
      }
      current = null;
    }

    for(let li=startIdx; li<lines.length; li++){
      const line = lines[li];

      if(absRe.test(line)){
        pushCurrent();
        let sub = 'Treino';
        if(exercises.length){
          if(exercises[0].name) sub = exercises[0].name;
          else if(exercises[0].items && exercises[0].items[0]) sub = exercises[0].items[0].name;
        }
        finalizeDay(exercises, warmup, sub);
        exercises = [];
        target = exercises;
        inAbs = true;
        continue;
      }

      const rmatch = line.match(roundsLineRe);
      if(rmatch){
        pushCurrent();
        const remainder = rmatch[2] || '';
        const restMatch = remainder.match(/(\d+(?:[.,]\d+)?\s*[’”'"])/);
        const restVal = restMatch ? restMatch[1].replace(/\s+/,'') : (remainder.trim() || '1’');
        current = {name:null, url:null, rounds: parseInt(rmatch[1],10), rest: restVal, reps:null, note:null, superset:false, items:[]};
        continue;
      }

      if(bisetRe.test(line)){ if(current) current.superset = true; continue; }

      const linkMatches = [...line.matchAll(/\[([^\]]+)\]\(([^)]+)\)/g)];
      if(linkMatches.length){
        if(!current){
          current = {name:null,url:null,rounds:4,rest:'1’',reps:null,note:null,superset:false,items:[]};
          warnings.push('Dia '+(ci+1)+': achei um exercício sem bloco de rounds antes — usei 4 rounds / 1’ como padrão.');
        }
        linkMatches.forEach(lm=>{
          const rawLabel = lm[1].trim();
          const url = lm[2].trim();
          if(current.superset){
            const sm = rawLabel.match(/^(\d+(?:-\d+)?|max reps)\s+(.*)$/i);
            if(sm){ current.items.push({name: sm[2].trim(), reps: /max/i.test(sm[1]) ? 'Max reps' : sm[1]+' reps', url}); }
            else{ current.items.push({name: rawLabel, reps:'', url}); }
          } else if(current.name === null){
            current.name = rawLabel;
            current.url = url;
          } else {
            if(current.url === null) current.url = url;
            if(current.reps === null){
              const noteMatch = rawLabel.match(/\(([^)]+)\)/);
              let repsText = rawLabel, note = null;
              if(noteMatch){ note = noteMatch[1].trim(); repsText = rawLabel.replace(noteMatch[0],'').trim(); }
              current.reps = repsText || rawLabel;
              current.note = note;
            } else {
              current.note = current.note ? current.note+'; '+rawLabel : rawLabel;
            }
          }
        });
        continue;
      }

      if(current && !current.superset){
        if(current.name === null){
          current.name = line.replace(/^[•\-]\s*/,'');
        } else if(current.reps === null){
          const noteMatch = line.match(/\(([^)]+)\)/);
          let repsText = line;
          let note = null;
          if(noteMatch){ note = noteMatch[1].trim(); repsText = line.replace(noteMatch[0],'').trim(); }
          current.reps = repsText || line;
          current.note = note;
        } else {
          const cleanLine = line.replace(/^[•\-]\s*/,'');
          current.note = current.note ? current.note+'; '+cleanLine : cleanLine;
        }
        continue;
      }

      if(current && current.superset){
        const cleanLine = line.replace(/^[•\-]\s*/,'');
        current.note = current.note ? current.note+'; '+cleanLine : cleanLine;
        continue;
      }

      warnings.push('Dia '+(ci+1)+': não entendi a linha "'+line+'".');
    }
    pushCurrent();

    let sub = 'Treino';
    if(exercises.length){
      if(exercises[0].name) sub = exercises[0].name;
      else if(exercises[0].items && exercises[0].items[0]) sub = exercises[0].items[0].name;
    }
    finalizeDay(exercises, inAbs ? {rounds:0, items:[]} : warmup, inAbs ? 'Abdominal' : sub);
  });

  return {days, warnings};
}

function htmlToPseudoText(html){
  const container = document.createElement('div');
  container.innerHTML = html;
  const blockTags = ['p','li','div','br','h1','h2','h3','tr'];
  function walk(node){
    let out = '';
    node.childNodes.forEach(child=>{
      if(child.nodeType === 3){
        out += child.textContent;
      } else if(child.nodeType === 1){
        const tag = child.tagName.toLowerCase();
        if(tag === 'a'){
          const href = child.getAttribute('href') || '';
          const label = child.textContent.trim();
          out += label ? '['+label+']('+href+')' : '';
        } else if(blockTags.includes(tag)){
          out += walk(child) + '\n';
        } else {
          out += walk(child);
        }
      }
    });
    return out;
  }
  return walk(container);
}

async function handleWordFile(file){
  const statusEl = document.getElementById('uploadStatus');
  if(!file) return;
  if(typeof mammoth === 'undefined'){
    statusEl.innerHTML = '<span style="color:var(--danger)">Não consegui carregar o leitor de Word (sem conexão?). Use "Colar texto manualmente" abaixo.</span>';
    return;
  }
  statusEl.textContent = 'Lendo '+file.name+'...';
  try{
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({arrayBuffer});
    const pseudoText = htmlToPseudoText(result.value);
    document.getElementById('importTextarea').value = pseudoText;
    statusEl.textContent = 'Arquivo lido. Analisando...';
    analyzeImport();
    statusEl.textContent = 'Arquivo lido: '+file.name;
  }catch(err){
    statusEl.innerHTML = '<span style="color:var(--danger)">Não consegui ler esse arquivo. Tente novamente ou cole o texto manualmente.</span>';
  }
}

let parsedImport = null;
function analyzeImport(){
  const raw = document.getElementById('importTextarea').value;
  const resultEl = document.getElementById('importResult');
  const confirmBtn = document.getElementById('confirmImportBtn');
  if(!raw.trim()){
    resultEl.innerHTML = '<div class="import-error">Cole o texto do treino primeiro.</div>';
    return;
  }
  try{
    const {days, warnings} = parseWorkoutText(raw);
    if(!days.length || days.every(d=>d.exercises.length===0)){
      resultEl.innerHTML = '<div class="import-error">Não consegui identificar exercícios nesse texto. Confira o formato e tente de novo.</div>';
      parsedImport = null;
      confirmBtn.style.display = 'none';
      return;
    }
    parsedImport = days;
    let html = '<div class="import-summary">';
    days.forEach(d=>{
      const total = d.exercises.length + (d.abs?d.abs.length:0);
      html += '<div class="import-day"><b>'+d.label+'</b> — '+total+' exercícios'+(d.abs?' + abdômen':'')+'</div>';
    });
    html += '</div>';
    if(warnings.length){
      html += '<div class="import-warnings">'+warnings.slice(0,5).map(w=>'⚠ '+w).join('<br>')+(warnings.length>5?'<br>+ '+(warnings.length-5)+' avisos':'')+'</div>';
    }
    resultEl.innerHTML = html;
    confirmBtn.style.display = 'block';
  }catch(err){
    resultEl.innerHTML = '<div class="import-error">'+err.message+'</div>';
    parsedImport = null;
    confirmBtn.style.display = 'none';
  }
}

function getEmbedUrl(url){
  if(!url) return null;
  let id = null;
  let m = url.match(/[?&]v=([^&]+)/);
  if(m){ id = m[1]; }
  if(!id){ m = url.match(/shorts\/([^?&]+)/); if(m) id = m[1]; }
  if(!id){ m = url.match(/youtu\.be\/([^?&]+)/); if(m) id = m[1]; }
  return id ? 'https://www.youtube.com/embed/'+id+'?playsinline=1&rel=0' : null;
}

let currentOpenVideo = null;
function toggleVideo(nameEl, id, url){
  const icon = nameEl.querySelector('.vid-icon');
  const el = document.getElementById(id);
  if(!el) return;
  const isOpen = el.classList.contains('open');

  if(currentOpenVideo && currentOpenVideo !== id){
    const prevEl = document.getElementById(currentOpenVideo);
    if(prevEl){ prevEl.classList.remove('open'); prevEl.innerHTML=''; }
  }

  if(isOpen){
    el.classList.remove('open');
    el.innerHTML = '';
    if(icon) icon.textContent = '▸';
    currentOpenVideo = null;
  } else {
    const embed = getEmbedUrl(url);
    el.innerHTML = embed
      ? '<iframe src="'+embed+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>'
      : '<div class="vid-fallback">Não consegui abrir o vídeo aqui dentro. <a href="'+url+'" target="_blank" rel="noopener">Abrir no YouTube</a></div>';
    el.classList.add('open');
    if(icon) icon.textContent = '▾';
    currentOpenVideo = id;
  }
}

function restToSeconds(r){
  if(!r) return 60;
  const n = parseFloat(r.replace(',','.'));
  if(isNaN(n)) return 0;
  if(r.includes('’') || r.includes("'") || r.toLowerCase().includes('min')) return Math.round(n*60);
  return Math.round(n);
}

let activeDay = 0;
let progress = {};
let storageOK = true;

async function loadProgress(){
  try{
    const res = await storageAPI.get('treino-progress', false);
    progress = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ progress = {}; }
}
async function saveProgress(){
  if(!storageOK) return;
  try{ await storageAPI.set('treino-progress', JSON.stringify(progress), false); }
  catch(e){ storageOK = false; }
}

function dayKey(dayId, exIdx, roundIdx){ return dayId+':'+exIdx+':'+roundIdx; }

function dayTotalRounds(day){
  let t=0;
  day.exercises.forEach(e=>t+=e.rounds);
  if(day.abs) day.abs.forEach(e=>t+=e.rounds);
  return t;
}
function dayDoneRounds(day){
  let t=0;
  day.exercises.forEach((e,i)=>{
    for(let r=0;r<e.rounds;r++){ if(progress[dayKey(day.id,'ex'+i,r)]) t++; }
  });
  if(day.abs) day.abs.forEach((e,i)=>{
    for(let r=0;r<e.rounds;r++){ if(progress[dayKey(day.id,'abs'+i,r)]) t++; }
  });
  return t;
}

function updateHeaderProgress(){
  const day = DATA[activeDay];
  const total = dayTotalRounds(day);
  const done = dayDoneRounds(day);
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('daySubLabel').textContent = day.label+' · '+day.sub;
  document.getElementById('dayFraction').textContent = done+'/'+total+' rounds';
  document.getElementById('dayProgressFill').style.width = pct+'%';
}

function renderTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  DATA.forEach((day, i)=>{
    const total = dayTotalRounds(day);
    const done = dayDoneRounds(day);
    const pct = total ? Math.min(100, Math.round(done/total*100)) : 0;
    const btn = document.createElement('div');
    btn.className = 'day-tab'+(i===activeDay?' active':'');
    btn.innerHTML =
      '<span class="letter">'+day.id+'</span>'+
      '<span class="sub">'+day.sub.split(' ')[0]+'</span>'+
      (pct>=100 ? '<span class="tab-check">✓</span>' : '')+
      '<span class="tab-progress"><span class="tab-progress-fill" style="width:'+pct+'%"></span></span>';
    btn.onclick = ()=>{ activeDay = i; renderAll(); };
    wrap.appendChild(btn);
  });
  updateHeaderProgress();
}

function exKeyId(day, exObj, isAbs, absIdx, exIdx){

}

function nameSpan(vidId, name, url){

function statBlock(label, value){
  if(!value) return '';
  return '<div class="stat"><span class="stat-label">'+label+'</span><span class="stat-value mono">'+value+'</span></div>';
}

function renderExercise(day, ex, keyId, num){
  const card = document.createElement('div');
  card.className = 'ex-card';

  if(ex.superset){
    let itemsHtml = '<div class="superset-tag">Bi-set</div>';
    ex.items.forEach((it, si)=>{
      itemsHtml += '<div class="sup-item">'+nameSpan('vid-'+day.id+'-'+keyId+'-'+si, it.name, it.url)+
        (it.reps?'<div><span class="reps-pill mono">'+it.reps+'</span></div>':'')+'</div>';
    });
    const groupStats = '<div class="ex-stats">'+statBlock('Rounds', ex.rounds)+statBlock('Descanso', ex.rest)+'</div>';
    card.innerHTML =
      '<div class="ex-top"><span class="ex-num">'+num+'</span><div class="ex-name-wrap">'+itemsHtml+groupStats+'</div></div>';
  } else {
    card.innerHTML =
      '<div class="ex-top">'+
        '<span class="ex-num">'+num+'</span>'+
        '<div class="ex-name-wrap">'+
          nameSpan('vid-'+day.id+'-'+keyId, ex.name, ex.url)+
          '<div class="ex-stats">'+statBlock('Rounds', ex.rounds)+statBlock('Descanso', ex.rest)+statBlock('Reps', ex.reps)+'</div>'+
          (ex.note?'<div class="ex-note">'+ex.note+'</div>':'')+
        '</div>'+
      '</div>';
  }

  const roundsWrap = document.createElement('div');
  roundsWrap.className = 'rounds';
  for(let r=0;r<ex.rounds;r++){
    const dot = document.createElement('div');
    const k = dayKey(day.id, keyId, r);
    const isDone = !!progress[k];
    dot.className = 'rnd'+(isDone?' done':'');
    dot.textContent = isDone ? '✓' : String(r+1);
    dot.onclick = ()=>{
      const wasDone = !!progress[k];
      progress[k] = !wasDone;
      saveProgress();
      dot.classList.toggle('done');
      dot.textContent = progress[k] ? '✓' : String(r+1);
      dot.classList.add('pop');
      setTimeout(()=>dot.classList.remove('pop'), 220);
      renderTabs();
      if(!wasDone && r < ex.rounds-1){
        startTimer(restToSeconds(ex.rest));
      }
    };
    roundsWrap.appendChild(dot);
  }
  card.appendChild(roundsWrap);
  return card;
}

function renderMain(){
  const day = DATA[activeDay];
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(day.warmup && day.warmup.items && day.warmup.items.length){
    const wu = document.createElement('div');

      const vidId = 'vid-'+day.id+'-wu-'+wi;

        ? '<span class="clickable" onclick="toggleVideo(this,\''+vidId+'\',\''+it.url.replace(/'/g,"\\'")+'\')">'+it.name+' <i class="vid-icon">▸</i></span>'
        : '<span>'+it.name+'</span>';
      wuHtml += '<div class="warmup-item-wrap"><div class="warmup-item">'+nameHtml+

    });
    wu.innerHTML = wuHtml;
    main.appendChild(wu);
  }

  const lbl1 = document.createElement('div');
  lbl1.className = 'section-label';
  lbl1.innerHTML = '<span>Exercícios</span><span class="line"></span>';
  main.appendChild(lbl1);

  day.exercises.forEach((ex, i)=>{
    main.appendChild(renderExercise(day, ex, exKeyId(day, ex, false, 0, i), String(i+1).padStart(2,'0')));
  });

  if(day.abs){
    const lbl2 = document.createElement('div');
    lbl2.className = 'section-label';
    lbl2.innerHTML = '<span>Abdominal</span><span class="line"></span>';
    main.appendChild(lbl2);
    day.abs.forEach((ex, i)=>{
      main.appendChild(renderExercise(day, ex, exKeyId(day, ex, true, i, 0), String(i+1).padStart(2,'0')));
    });
  }

  const resetBtn = document.createElement('button');
  resetBtn.className = 'reset-btn';
  resetBtn.textContent = 'Reiniciar treino '+day.id;
  resetBtn.onclick = ()=>{
    Object.keys(progress).forEach(k=>{ if(k.startsWith(day.id+':')) delete progress[k]; });
    saveProgress();
    renderAll();
  };
  main.appendChild(resetBtn);

  updateHeaderProgress();
}

let timerInterval = null;
let timerTotal = 0;
let timerRemaining = 0;
let timerPaused = false;

function startTimer(seconds){
  clearInterval(timerInterval);
  timerTotal = seconds;
  timerRemaining = seconds;
  timerPaused = false;
  document.getElementById('pauseBtn').textContent = '⏸';
  const bar = document.getElementById('timerBar');
  bar.classList.add('show');
  updateTimerDisplay();
  timerInterval = setInterval(tickTimer, 1000);
}
function tickTimer(){
  timerRemaining--;
  if(timerRemaining <= 0){
    clearInterval(timerInterval);
    document.getElementById('timerBar').classList.remove('show');
    if(navigator.vibrate) navigator.vibrate([120,60,120]);
    flashScreen();
    return;
  }
  updateTimerDisplay();
}

function flashScreen(){
  const el = document.getElementById('timerFlash');
  el.classList.remove('active');
  void el.offsetWidth;
  el.classList.add('active');
  setTimeout(()=> el.classList.remove('active'), 2200);
}

let wakeLock = null;
async function requestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(wakeLock !== null && document.visibilityState === 'visible'){
    requestWakeLock();
  }
});
function updateTimerDisplay(){
  const s = Math.max(0, timerRemaining);
  const m = Math.floor(s/60);
  const sec = s%60;
  document.getElementById('timerNum').textContent = String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  const pct = timerTotal ? Math.max(0, Math.min(100, (timerRemaining/timerTotal)*100)) : 0;
  document.getElementById('timerProgressFill').style.width = pct+'%';
}
function adjustTimer(delta){
  if(timerTotal === 0) return;
  timerRemaining = Math.max(0, timerRemaining + delta);
  timerTotal = Math.max(timerTotal, timerRemaining);
  updateTimerDisplay();
}
document.getElementById('minus15Btn').onclick = ()=> adjustTimer(-15);
document.getElementById('plus15Btn').onclick = ()=> adjustTimer(15);
document.getElementById('pauseBtn').onclick = ()=>{
  if(timerTotal === 0) return;
  timerPaused = !timerPaused;
  if(timerPaused){
    clearInterval(timerInterval);
    document.getElementById('pauseBtn').textContent = '⏵';
  } else {
    timerInterval = setInterval(tickTimer, 1000);
    document.getElementById('pauseBtn').textContent = '⏸';
  }
};
document.getElementById('skipBtn').onclick = ()=>{
  clearInterval(timerInterval);
  document.getElementById('timerBar').classList.remove('show');
};

function renderAll(){
  renderTabs();
  renderMain();
}

(async ()=>{
  try{
    await loadProgress();
    const custom = await loadCustomWorkout();
    if(custom) DATA = custom;
  }catch(e){}
  renderAll();
  requestWakeLock();
})();
</script>
</body>
